            --merah: #c0392b;
            --merah-tua: #922b21;
            --emas: #d4ac0d;
            --emas-muda: #f1c40f;

        }

            margin: 0;
            padding: 0;
        }

            background-position: center;

            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(212, 172, 13, 0.2);

            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);

        .navbar-brand {

            font-size: 18px;
            font-weight: 800;
            color: var(--emas);

        .navbar-brand span {

            font-weight: 400;
            font-size: 14px;

        .upload-bg {

            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: 1px solid rgba(212, 172, 13, 0.4);
            border-radius: 8px;
            background: transparent;
            color: var(--emas);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .upload-bg:hover {
            background: rgba(212, 172, 13, 0.1);
            border-color: var(--emas);
        }
        
        .upload-bg input[type="file"] {
            display: none;
        }
        
        .btn-reset-bg {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: 1px solid rgba(192, 57, 43, 0.4);
            border-radius: 8px;
            background: transparent;
            color: #f1948a;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-reset-bg:hover {
            background: rgba(192, 57, 43, 0.1);
            border-color: var(--merah);
        }

            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            border: 1px solid rgba(212, 172, 13, 0.4);
            border-radius: 8px;
            background: transparent;
            color: var(--emas);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;

        .btn-kembali:hover {

            border-radius: 20px;
            padding: 40px;

            align-items: center;

            box-shadow: 8px 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 172, 13, 0.2);

            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            gap: 18px;

            font-size: 12px;
            background: rgba(192, 57, 43, 0.25);

            color: #f1948a;
            align-self: flex-start;

        .judul-buku {

            font-weight: 800;
            line-height: 1.2;
            color: var(--krem);

        .penulis-buku {

            font-style: italic;
            font-size: 18px;
            color: rgba(253, 246, 227, 0.6);

            background: rgba(212, 172, 13, 0.2);
        }

            padding-bottom: 10px;
            border-bottom: 1px solid rgba(212, 172, 13, 0.2);

            border: 1px solid rgba(212, 172, 13, 0.1);
            border-radius: 10px;
            padding: 16px;
            text-decoration: none;
            transition: 0.25s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .kartu-buku-kecil:hover {
            background: rgba(253, 246, 227, 0.08);
            border-color: rgba(212, 172, 13, 0.3);
            transform: translateY(-2px);
        }
        
        .kartu-kecil-judul {
            font-family: 'EB Garamond', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--krem);
            line-height: 1.3;
        }
        
        .kartu-kecil-penulis {
            font-size: 12px;
            color: rgba(253, 246, 227, 0.45);
        }
        
        .kartu-kecil-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 3px;
            background: rgba(192, 57, 43, 0.2);
            border: 1px solid rgba(192, 57, 43, 0.3);
            color: #f1948a;
            align-self: flex-start;
        }

            padding: 30px 20px;
            border-top: 1px solid rgba(212, 172, 13, 0.2);
            color: rgba(253, 246, 227, 0.3);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            gap: 20px;
            color: rgba(253, 246, 227, 0.5);

            font-size: 64px;
        }
        /* Responsive */
        
        @media (max-width: 680px) {
            .navbar {
                padding: 15px 20px;
            }
            .kartu-detail {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 25px;
            }
            .wadah-cover {
                max-width: 180px;
            }
            .meta-grid {
                grid-template-columns: 1fr;
            }
            .konten-utama {
                padding: 30px 16px;
            }
        }
    </style>
</head>

                <div class="garis"></div>
                <div>
                    <p class="sinopsis-judul">Sinopsis</p>
                    <p class="sinopsis-teks">${buku.sinopsis}</p>
                </div>
            </div>
        </div>

        ${bukuLain.length > 0 ? `
        <div class="bagian-lain">
            <h3 class="bagian-judul">Buku Serupa — ${buku.kategori}</h3>
            <div class="grid-lain">
                ${bukuLain.map(b => `
                    <a href="detail.html?id=${b.id}" class="kartu-buku-kecil">
                        <span class="kartu-kecil-judul">${b.judul}</span>
                        <span class="kartu-kecil-penulis">${b.penulis}</span>
                        <span class="kartu-kecil-badge">${b.status}</span>
                    </a>
                `).join('')}
            </div>
        </div>` : ''}
    `;
}

function handleFavorit() {
    const btn = document.getElementById('btnFav');
    const ikon = document.getElementById('ikonFav');
    const teks = document.getElementById('teksF');

    if (favoritSet.has(buku.id)) {
        favoritSet.delete(buku.id);
        ikon.textContent = '🤍';
        teks.textContent = 'Tambah Favorit';
        btn.classList.remove('aktif');
    } else {
        favoritSet.add(buku.id);
        ikon.textContent = '❤️';
        teks.textContent = 'Difavoritkan';
        btn.classList.add('aktif');
    }
    simpanFavorit();
}

// ============================================================
// FITUR BACKGROUND KUSTOM
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('uploadBg').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.body.style.backgroundImage = `url(${e.target.result})`;
                // Simpan ke localStorage agar tetap ada saat refresh
                localStorage.setItem('gmni-bg', e.target.result);
            };
            reader.readAsDataURL(file);
        }
    });
});

function resetBackground() {
    document.body.style.backgroundImage = 'none';
    localStorage.removeItem('gmni-bg');
}

// Load background dari localStorage saat halaman load
window.addEventListener('load', function() {
    const savedBg = localStorage.getItem('gmni-bg');
    if (savedBg) {
        document.body.style.backgroundImage = `url(${savedBg})`;
    }
});
    </script>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan GMNI Cabang Banjarmasin</title>
    <link href="https://th.bing.com/th/id/OIP.wTRDIxrctebP9ikK2Hyk2gHaEn?w=253&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" rel="stylesheet">
    <style>
         :root {
            --merah: #c0392b;
            --merah-tua: #922b21;
            --merah-muda: #e74c3c;
            --emas: #d4ac0d;
            --emas-muda: #f1c40f;
            --gelap: #1a0a0a;
            --gelap2: #2c1010;
            --krem: #fdf6e3;
            --krem2: #f5e6c8;
            --abu: #8b7355;
            --putih: #ffffff;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--gelap);
            color: var(--krem);
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* =====================
           HERO / HEADER
        ===================== */
        
        .hero {
            position: relative;
            width: 100%;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 60px 20px;
        }
        /* 
        ============================================================
        PANDUAN FOTO BACKGROUND:
        Ganti URL di bawah ini dengan path foto kamu.
        
        Contoh jika foto ada di folder yang sama:
            background-image: url('foto-perpustakaan.jpg');
        
        Contoh jika foto ada di subfolder:
            background-image: url('images/foto.jpg');
        
        Ukuran foto yang disarankan: minimal 1920x600 px (landscape)
        ============================================================
        */
        
        .hero-bg {
            position: absolute;
            inset: 0;
            background-image: url('assets/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.35);
            z-index: 0;
        }
        /* Jika tidak ada foto, tampilkan gradient merah sebagai fallback */
        
        .hero-bg-fallback {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #6b0000 0%, #1a0a0a 50%, #3d0c02 100%);
            z-index: 0;
        }
        
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(26, 10, 10, 0.3) 0%, rgba(26, 10, 10, 0.85) 100%);
            z-index: 1;
        }
        /* Motif batang padi dekoratif */
        
        .hero-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 15% 85%, rgba(192, 57, 43, 0.15) 0%, transparent 50%), radial-gradient(circle at 85% 15%, rgba(212, 172, 13, 0.1) 0%, transparent 40%);
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 850px;
        }
        
        .logo-gmni {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--merah), var(--merah-tua));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 2px solid var(--emas);
            box-shadow: 0 0 30px rgba(192, 57, 43, 0.5);
            flex-shrink: 0;
        }
        
        .garis-emas {
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--emas), transparent);
            margin: 0 auto 15px;
        }
        
        .label-organisasi {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--emas);
            margin-bottom: 12px;
        }
        
        .nama-perpustakaan {
            font-family: 'EB Garamond', serif;
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 800;
            line-height: 1.3;
            color: var(--krem);
            text-shadow: 2px 2px 20px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
        }
        
        .nama-cabang {
            font-family: 'EB Garamond', serif;
            font-size: clamp(16px, 2.5vw, 22px);
            font-weight: 400;
            font-style: italic;
            color: var(--emas-muda);
            margin-bottom: 20px;
        }
        
        .deskripsi-hero {
            font-size: 14px;
            color: rgba(253, 246, 227, 0.65);
            letter-spacing: 0.5px;
        }
        /* Counter Strip */
        
        .counter-strip {
            background: linear-gradient(to right, var(--merah-tua), var(--merah), var(--merah-tua));
            padding: 18px 20px;
            display: flex;
            justify-content: center;
            gap: 50px;
            border-top: 1px solid var(--emas);
            border-bottom: 1px solid var(--emas);
        }
        
        .counter-item {
            text-align: center;
        }
        
        .counter-angka {
            font-family: 'EB Garamond', serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--emas-muda);
            display: block;
        }
        
        .counter-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(253, 246, 227, 0.7);
        }
        /* =====================
           AREA KONTROL
        ===================== */
        
        .area-kontrol {
            max-width: 960px;
            margin: 35px auto 20px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .input-cari {
            width: 100%;
            padding: 14px 22px;
            background: rgba(253, 246, 227, 0.06);
            border: 1px solid rgba(212, 172, 13, 0.35);
            border-radius: 8px;
            color: var(--krem);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            transition: 0.3s;
        }
        
        .input-cari::placeholder {
            color: rgba(253, 246, 227, 0.35);
        }
        
        .input-cari:focus {
            outline: none;
            border-color: var(--emas);
            background: rgba(253, 246, 227, 0.09);
            box-shadow: 0 0 0 3px rgba(212, 172, 13, 0.15);
        }
        /* Filter Kategori */
        
        .filter-kategori {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .btn-filter {
            padding: 7px 18px;
            border-radius: 30px;
            border: 1px solid rgba(212, 172, 13, 0.4);
            background: transparent;
            color: rgba(253, 246, 227, 0.7);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: 0.25s;
        }
        
        .btn-filter:hover,
        .btn-filter.aktif {
            background: var(--merah);
            border-color: var(--merah);
            color: white;
        }
        /* Sorting */
        
        .bar-sorting {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .label-sort {
            font-size: 12px;
            color: rgba(253, 246, 227, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-sort {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid rgba(253, 246, 227, 0.15);
            background: transparent;
            color: rgba(253, 246, 227, 0.6);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .btn-sort:hover {
            border-color: var(--emas);
            color: var(--emas);
        }
        
        .btn-sort.aktif-sort {
            border-color: var(--emas);
            color: var(--emas);
            background: rgba(212, 172, 13, 0.1);
        }
        /* =====================
           TABEL UTAMA
        ===================== */
        
        .wadah-tabel {
            max-width: 960px;
            margin: 0 auto 60px;
            padding: 0 20px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(253, 246, 227, 0.03);
            border: 1px solid rgba(212, 172, 13, 0.2);
            border-radius: 12px;
            overflow: hidden;
        }
        
        thead {
            background: linear-gradient(to right, rgba(192, 57, 43, 0.4), rgba(192, 57, 43, 0.2));
        }
        
        th {
            padding: 16px 18px;
            text-align: left;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--emas);
            border-bottom: 1px solid rgba(212, 172, 13, 0.3);
        }
        
        td {
            padding: 15px 18px;
            border-bottom: 1px solid rgba(253, 246, 227, 0.06);
            font-size: 14px;
            color: rgba(253, 246, 227, 0.85);
            vertical-align: middle;
        }
        
        tbody tr:hover {
            background: rgba(253, 246, 227, 0.04);
        }
        
        tbody tr:last-child td {
            border-bottom: none;
        }
        
        .link-judul {
            color: var(--krem);
            text-decoration: none;
            font-family: 'EB Garamond', serif;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .link-judul:hover {
            color: var(--emas-muda);
        }
        
        .badge-kategori {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            background: rgba(192, 57, 43, 0.25);
            border: 1px solid rgba(192, 57, 43, 0.4);
            color: #f1948a;
            white-space: nowrap;
        }
        
        .badge-status {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
        
        .status-tersedia {
            background: rgba(39, 174, 96, 0.2);
            border: 1px solid rgba(39, 174, 96, 0.4);
            color: #82e0aa;
        }
        
        .status-dipinjam {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #f1948a;
        }
        
        .status-segera {
            background: rgba(243, 156, 18, 0.2);
            border: 1px solid rgba(243, 156, 18, 0.4);
            color: #f9e79f;
        }
        /* Rating bintang */
        
        .rating {
            color: var(--emas-muda);
            font-size: 13px;
            letter-spacing: 1px;
        }
        /* Tombol favorit */
        
        .btn-favorit {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s;
            padding: 0;
        }
        
        .btn-favorit:hover {
            transform: scale(1.3);
        }
        
        .no-kolom {
            color: rgba(253, 246, 227, 0.3);
            font-size: 13px;
        }
        /* Pesan kosong */
        
        .pesan-kosong {
            text-align: center;
            padding: 60px 20px;
            color: rgba(253, 246, 227, 0.35);
        }
        
        .pesan-kosong-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        /* Footer */
        
        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(212, 172, 13, 0.2);
            color: rgba(253, 246, 227, 0.3);
            font-size: 13px;
        }
        
        .footer-nama {
            color: var(--emas);
        }
        /* =====================
           RESPONSIVE MOBILE
        ===================== */
        
        @media (max-width: 768px) {
            .counter-strip {
                gap: 25px;
            }
            .counter-angka {
                font-size: 22px;
            }
            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }
            thead tr {
                display: none;
            }
            tbody tr {
                background: rgba(253, 246, 227, 0.04);
                border: 1px solid rgba(212, 172, 13, 0.15);
                border-radius: 10px;
                margin-bottom: 16px;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                border-bottom: 1px solid rgba(253, 246, 227, 0.05);
            }
            td::before {
                content: attr(data-label);
                font-size: 11px;
                color: rgba(253, 246, 227, 0.4);
                text-transform: uppercase;
                letter-spacing: 1px;
                flex-shrink: 0;
                margin-right: 10px;
            }
            td:last-child {
                border-bottom: none;
            }
        }
    </style>
</head>

    <!-- =========== HERO =========== -->

        <div class="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-pattern"></div>

        <div class="hero-content">
            <div class="logo-gmni">
                <div class="logo-icon">📚</div>
            </div>
            <p class="label-organisasi">Gerakan Mahasiswa Nasional Indonesia</p>
            <div class="garis-emas"></div>

    <!-- =========== TABEL =========== -->

            <tbody id="isiTabel"></tbody>
        </table>
    </div>

    <footer>
        &copy; 2026 &nbsp;|&nbsp; By <span class="footer-nama">Musa Al Kadzim</span>
    </footer>

        // Render semua buku ke tabel
        function renderTabel(dataBuku) {
            const tbody = document.getElementById('isiTabel');
            if (dataBuku.length === 0) {
                tbody.innerHTML = `
            <tr><td colspan="8">
                <div class="pesan-kosong">
                    <div class="pesan-kosong-icon">📭</div>
                    <p>Tidak ada buku yang ditemukan.</p>
                </div>
            </td></tr>`;
                return;
            }

            tbody.innerHTML = dataBuku.map((buku, i) => {
                const isFav = favoritSet.has(buku.id);
                const statusClass = buku.status === 'Tersedia' ? 'status-tersedia' :
                    buku.status === 'Dipinjam' ? 'status-dipinjam' : 'status-segera';
                const bintang = '★'.repeat(buku.rating) + '☆'.repeat(5 - buku.rating);

                return `
        <tr>
            <td data-label="No." class="no-kolom">${i + 1}</td>
            <td data-label="Judul">
                <a href="detail.html?id=${buku.id}" class="link-judul">${buku.judul}</a>
            </td>
            <td data-label="Penulis">${buku.penulis}</td>
            <td data-label="Tahun">${buku.tahun}</td>
            <td data-label="Kategori"><span class="badge-kategori">${buku.kategori}</span></td>
            <td data-label="Status"><span class="badge-status ${statusClass}">${buku.status}</span></td>
            <td data-label="Rating"><span class="rating">${bintang}</span></td>

            </td>

            }).join('');

                const cocokKategori = filterAktif === 'semua' || buku.kategori === filterAktif;
                const cocokCari = (
                    buku.judul.toLowerCase().includes(keyword) ||
                    buku.penulis.toLowerCase().includes(keyword) ||
                    buku.kategori.toLowerCase().includes(keyword)
                );
                return cocokKategori && cocokCari;
            });

            hasil.sort((a, b) => {
                let va = a[sortKolom],
                    vb = b[sortKolom];
                if (sortKolom === 'tahun' || sortKolom === 'rating') {
                    return (Number(va) - Number(vb)) * sortArah;
                }
                return va.localeCompare(vb) * sortArah;
            });

            renderTabel(hasil);
        }

        // Update counter strip
        function updateCounter() {
            document.getElementById('ctr-total').textContent = daftarBuku.length;
            document.getElementById('ctr-tersedia').textContent = daftarBuku.filter(b => b.status === 'Tersedia').length;
            document.getElementById('ctr-favorit').textContent = favoritSet.size;
        }

        // Bangun tombol filter dari data
        function bangunFilter() {
            const kategoriUnik = ['semua', ...new Set(daftarBuku.map(b => b.kategori))];
            const container = document.getElementById('filterKategori');
            container.innerHTML = kategoriUnik.map(k => `
        <button class="btn-filter ${k === 'semua' ? 'aktif' : ''}" data-kategori="${k}">
            ${k === 'semua' ? 'Semua' : k}
        </button>
    `).join('');

            container.querySelectorAll('.btn-filter').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('aktif'));
                    btn.classList.add('aktif');
                    filterAktif = btn.dataset.kategori;
                    prosesData();
                });
            });
        }

        // Toggle favorit
        function toggleFavorit(id, btn) {
            if (favoritSet.has(id)) {
                favoritSet.delete(id);
                btn.textContent = '🤍';
                btn.title = 'Tambah ke favorit';
            } else {
                favoritSet.add(id);
                btn.textContent = '❤️';
                btn.title = 'Hapus dari favorit';
            }
            localStorage.setItem('gmni-favorit', JSON.stringify([...favoritSet]));
            updateCounter();
        }

        // Event listeners
        document.getElementById('inputCari').addEventListener('input', prosesData);

        document.querySelectorAll('.btn-sort').forEach(btn => {
            btn.addEventListener('click', () => {
                const kolom = btn.dataset.sort;
                if (sortKolom === kolom) {
                    sortArah *= -1;
                } else {
                    sortKolom = kolom;
                    sortArah = 1;
                }
                document.querySelectorAll('.btn-sort').forEach(b => b.classList.remove('aktif-sort'));
                btn.classList.add('aktif-sort');
                btn.textContent = btn.textContent.replace('↕', sortArah === 1 ? '↑' : '↓').replace('↑', sortArah === 1 ? '↑' : '↓').replace('↓', sortArah === 1 ? '↑' : '↓');
                prosesData();
            });
        });

        // Init
        bangunFilter();
        prosesData();
        updateCounter();
    </script>
</body>

</html>
